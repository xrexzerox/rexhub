# Render blueprint: push this folder to a GitHub repo, then
# Render dashboard -> New + -> Blueprint -> pick the repo -> Apply.
services:
  - type: web
    name: nvio-all-addon
    runtime: node
    plan: free
    buildCommand: "true"          # zero npm dependencies - nothing to build
    startCommand: "node server.js"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PROVIDER_TIMEOUT_MS
        value: "15000"            # per-scraper hard cap (v1.1: was 20000)
      - key: RESPONSE_DEADLINE_MS
        value: "15000"            # absolute max wait for one stream response
      - key: EARLY_MIN_MS
        value: "4000"             # floor wait before an early response
      - key: EARLY_ROWS
        value: "6"                # respond early once this many rows landed
      - key: EARLY_DONE_PROVIDERS
        value: "20"               # ...or this many scrapers finished with >=1 row
      - key: MID_MIN_MS
        value: "9000"             # v1.1: second checkpoint - sparse requests
                                  # answer here once >=1 row exists
      - key: TMDB_CACHE_TTL_MS
        value: "600000"           # v1.1: coalesced TMDB metadata cache (10 min)
      - key: STREAM_CACHE_TTL_MS
        value: "1800000"          # repeat requests answered instantly for 30min
      - key: ZERO_ROW_TTL_MS
        value: "90000"            # v1.3: empty results cached only 90s - one bad
                                  # fan-out (deploy restart, upstream flap) can no
                                  # longer keep a title empty for 30 minutes
      - key: MAX_ROWS
        value: "100"
      # v1.2: torrent lanes (torrents, tagalogtorrents) are ON by default.
      # To go back to direct/HLS-only, re-add:
      #   SKIP_PROVIDERS: "torrents,tagalogtorrents"
      # Optional: feed providers their device-side settings as JSON, e.g.
      # debrid keys (torrent lane -> instant cached http links) or showbox tokens:
      # - key: SCRAPER_SETTINGS_JSON
      #   sync: false   # paste e.g. {"debridProvider":"realdebrid","debridKey":"..."}
      # v1.5: egress control - "scraper works in the Nuvio app but empty here"
      # = the site blocks Render's datacenter IP. Either self-host the free
      # Cloudflare relay (README -> addons/stream-relay) ...
      - key: RELAY_URL
        value: ""                # e.g. https://nvio-relay.your-subdomain.workers.dev
      - key: RELAY_KEY
        value: ""                # only if the worker has RELAY_KEY set
      # ... or route every scraper request through an HTTP(S) proxy:
      - key: PROXY_URL
        value: ""                # e.g. http://user:pass@proxyhost:port
      - key: KEEP_WARM
        value: "true"             # self-ping /healthz every 14min (kills cold starts)
