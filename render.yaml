# Render blueprint: push this folder to a GitHub repo, then
# Render dashboard -> New + -> Blueprint -> pick the repo -> Apply.
services:
  - type: web
    name: nvio-all-addon
    runtime: node
    plan: free
    buildCommand: "true"          # zero npm dependencies - nothing to build
    startCommand: "node server.js"
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PROVIDER_TIMEOUT_MS
        value: "15000"            # per-scraper hard cap (v1.1: was 20000)
      - key: RESPONSE_DEADLINE_MS
        value: "15000"            # absolute max wait for one stream response
      - key: EARLY_MIN_MS
        value: "4000"             # floor wait before an early response
      - key: EARLY_ROWS
        value: "6"                # respond early once this many rows landed
      - key: EARLY_DONE_PROVIDERS
        value: "20"               # ...or this many scrapers finished with >=1 row
      - key: MID_MIN_MS
        value: "9000"             # v1.1: second checkpoint - sparse requests
                                  # answer here once >=1 row exists
      - key: TMDB_CACHE_TTL_MS
        value: "600000"           # v1.1: coalesced TMDB metadata cache (10 min)
      - key: STREAM_CACHE_TTL_MS
        value: "1800000"          # repeat requests answered instantly for 30min
      - key: MAX_ROWS
        value: "100"
      - key: SKIP_PROVIDERS
        value: "torrents,tagalogtorrents"
      - key: KEEP_WARM
        value: "true"             # self-ping /healthz every 14min (kills cold starts)
